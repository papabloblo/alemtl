[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alemtl"
version = "0.1.0"
description = "Accumulated Local Effects and Frechet task similarity for multi-task learning."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE.txt"]
authors = [
    { name = "Pablo Hidalgo", email = "pablo.hidalgo@ufv.es" },
    { name = "Adrián Domínguez-Díaz", email = "adrian.dominguez@uah.es" },
    { name = "Daniel Rodriguez", email = "daniel.rodriguez@uah.es" },
]
maintainers = [
    { name = "Pablo Hidalgo", email = "pablo.hidalgo@ufv.es" },
]
keywords = [
    "accumulated-local-effects",
    "explainable-ai",
    "frechet-distance",
    "multi-task-learning",
    "pytorch",
    "task-similarity",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "Pillow>=9.0",
    "scikit-learn>=1.2",
    "scipy>=1.9",
    "torch>=2.0",
    "torchvision>=0.15",
]

[project.urls]
Homepage = "https://github.com/papabloblo/alemtl"
Repository = "https://github.com/papabloblo/alemtl"
Documentation = "https://github.com/papabloblo/alemtl/README.md"
"Bug Tracker" = "https://github.com/papabloblo/alemtl/issues"
Changelog = "https://github.com/papabloblo/alemtl/releases"

[project.optional-dependencies]
dev = [
    "build>=1.0",
    "pytest>=7.0",
    "twine>=4.0",
]
docs = [
    "Sphinx>=7.0",
]
notebooks = [
    "ipykernel>=6.0",
    "jupyterlab>=4.0",
]
publication = [
    "build>=1.0",
    "ipykernel>=6.0",
    "jupyterlab>=4.0",
    "matplotlib>=3.7",
    "pytest>=7.0",
    "Sphinx>=7.0",
    "twine>=4.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["alemtl*"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = [".", "src"]
testpaths = ["tests"]
