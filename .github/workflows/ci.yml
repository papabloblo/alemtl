name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      - name: Build package
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Install wheel and verification tools
        run: |
          python -m pip install dist/*.whl
          python -m pip install pytest matplotlib sphinx
          python -m pip check
      - name: Test installed wheel outside source tree
        shell: bash
        run: |
          check_dir=$(mktemp -d)
          cp -r tests examples "$check_dir/"
          cd "$check_dir"
          unset PYTHONPATH
          export PYTHONNOUSERSITE=1
          python -c "import alemtl; from pathlib import Path; assert 'site-packages' in Path(alemtl.__file__).parts, alemtl.__file__"
          python -m pytest -q tests
          python examples/reproduce_revised_table.py --smoke --workers 1 --output table.tex
          test -s table.tex
          python examples/reproduce_nonlinear_figures.py --output figures
          python examples/custom_similarity.py --checkpoint figures/checkpoint.pt
      - name: Build documentation against installed wheel
        env:
          ALEMTL_DOCS_INSTALLED: "1"
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html
